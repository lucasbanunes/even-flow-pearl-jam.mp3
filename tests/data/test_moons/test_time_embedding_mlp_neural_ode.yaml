dataset:
  batch_size: 32
model:
  input_shape: [2]
  vector_field:
    input_dim: 2
    freqs: 3
    neurons_per_layer:
      - 13
      - 13
      - 2
    activations:
      - gelu
      - gelu
      - gelu
  checkpoint:
    monitor: val_loss
    mode: min
  early_stopping:
    monitor: val_loss
    mode: min
  max_epochs: 3
  max_time:
    minutes: 5
